# Clawrefang Workflow Community Or Ci Config Update

## Action

Follow the community-or-ci-config-update workflow:
1. Edit .github/ workflows, issue templates, or pull request templates.
2. Optionally update README.md, SECURITY.md, or docs/*.md.
3. Optionally make minor code or config changes (e.g., kernel.rs, model_catalog.rs, install.sh).
4. Commit all changes together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .github/workflows/*.yml, .github/ISSUE_TEMPLATE/*.yml, .github/pull_request_template.md

