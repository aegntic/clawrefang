# Clawrefang Workflow Multi Crate Bugfix Batch

## Action

Follow the multi-crate-bugfix-batch workflow:
1. Identify bugs or minor improvements in various crates and modules.
2. Edit relevant source files (Rust, JS, TOML, etc.) in multiple crates (api, kernel, runtime, cli, channels, etc.).
3. Update shared files like Cargo.toml and Cargo.lock to reflect dependency or version changes.
4. Commit all changes together with a message like 'batch fixes', 'bugfix batch', or 'bugfixes batch'.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~10x per month
- Files: Cargo.toml, Cargo.lock, crates/openfang-api/src/routes.rs

